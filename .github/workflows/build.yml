name: build apk

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - name: android sdk + ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ndk=$(grep -oP 'ndkVersion = "\K[^"]+' app/build.gradle.kts)
          echo "ndk $ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # fresh built-in bridges from the Tor Project for every build; keeps the bundled ones if the fetch fails
      - name: refresh built-in bridges
        run: |
          a=app/src/main/assets
          if curl -fsSL --max-time 60 https://bridges.torproject.org/moat/circumvention/builtin -o /tmp/b.json \
             && python3 -c "import json,sys;d=json.load(open('/tmp/b.json'));sys.exit(0 if d.get('obfs4') and d.get('snowflake') else 1)"; then
            cp /tmp/b.json $a/builtin-bridges.json
            python3 -c "import json;d=json.load(open('$a/builtin-bridges.json'));print({k:len(v) for k,v in d.items()})"
          else
            echo "::warning::bridge refresh failed, using bundled list"
          fi

      - name: signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SIGN_STORE=$RUNNER_TEMP/release.jks"
              echo "SIGN_STORE_PASS=$KEYSTORE_PASS"
              echo "SIGN_KEY_PASS=$KEYSTORE_PASS"
              echo "SIGN_KEY_ALIAS=pol"
              echo "SIGNED=1"
            } >> "$GITHUB_ENV"
          else
            # no release key yet: throwaway key so the build can still be checked and installed for testing
            keytool -genkeypair -keystore "$RUNNER_TEMP/tmp.jks" -alias pol -keyalg RSA -keysize 2048 \
              -validity 365 -storepass temppass -keypass temppass -dname "CN=Pol test" > /dev/null
            {
              echo "SIGN_STORE=$RUNNER_TEMP/tmp.jks"
              echo "SIGN_STORE_PASS=temppass"
              echo "SIGN_KEY_PASS=temppass"
              echo "SIGN_KEY_ALIAS=pol"
              echo "SIGNED=0"
            } >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_B64 secret missing, built with a throwaway key (test only, no release)"
          fi

      - name: build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullpermRelease

      - name: collect
        run: |
          mkdir out
          ver=$(grep -oP 'polVersionName = "\K[^"]+' app/build.gradle.kts)
          ls -la app/build/outputs/apk/fullperm/release/
          for f in app/build/outputs/apk/fullperm/release/*.apk; do
            n=$(basename "$f" .apk)
            abi=$(echo "$n" | sed -E 's/^Pol-[^-]+-fullperm-//; s/-release.*$//')
            cp "$f" "out/Pol-${ver}-${abi}.apk"
          done
          ls -la out
          echo "VER=${ver}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: release
        if: env.SIGNED == '1' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: پُل v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: |
            پُل فقط یه دکمه‌ی گرد داره. روش بزنی خودش از سرور Tor پل تازه می‌گیره و بعد Snowflake، پل‌های اختصاصی، WebTunnel، obfs4 و meek رو یکی‌یکی امتحان می‌کنه تا یکی وصل بشه. زیر دکمه هم می‌نویسه الان داره کدوم رو امتحان می‌کنه.

            اگه هیچ‌کدوم جواب نداد خودش خبر می‌ده و ربات پل‌های Tor رو باز می‌کنه. پل‌ها رو کپی کنی و برگردی، خودش برشون می‌داره و وصل می‌شه.

            برای بیشتر گوشی‌ها فایل `arm64-v8a` رو بگیر. اگه مطمئن نیستی `universal`.
